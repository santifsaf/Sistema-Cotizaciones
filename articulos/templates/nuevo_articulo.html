{% extends "estructura_base.html" %}
{% load static %}
{% block content %} 

<section class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow p-4" style="min-width: 350px; max-width: 500px; width: 100%;">
        <h2 class="mb-4 text-center">Nuevo Artículo</h2>
        <form method="POST" enctype="multipart/form-data" autocomplete="off">
            {% csrf_token %}
            <div class="mb-3">
                {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div class="text-danger small">{{ field.errors }}</div>
                    {% endif %}
                </div>
                {% endfor %}
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary" data-loading-text="Guardando...">Guardar</button>
            </div>
        </form>
    </div>
</section>

{% endblock %}
